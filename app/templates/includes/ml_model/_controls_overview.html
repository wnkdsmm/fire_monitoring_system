<section class="panel filters-panel">
    <div class="panel-head">
        <h2>Параметры сравнения</h2>
        <span class="panel-meta">Три линии по дням месяца: Год 1, Год 2 и Compare-series (Год ML).</span>
    </div>
    <form class="filters-grid ml-controls-grid" id="mlModelForm" method="get" action="/ml-model">
        <label class="filter-field">
            <span>Месяц</span>
            <select id="mlMonthFilter" name="month"></select>
        </label>
        <label class="filter-field">
            <span>Год 1</span>
            <select id="mlYearAFilter" name="year_a"></select>
        </label>
        <label class="filter-field">
            <span>Год 2</span>
            <select id="mlYearBFilter" name="year_b"></select>
        </label>
        <label class="filter-field">
            <span>Год ML (текущий .. +3)</span>
            <select id="mlFutureYearFilter" name="year_ml"></select>
        </label>
    </form>
    <div id="mlCompareChart" class="plotly-chart ml-plot{% if not data.compare_series or not data.compare_series.history_has_data %} is-empty{% endif %}"></div>
    <div id="mlCompareChartFallback" class="chart-empty{% if data.compare_series and data.compare_series.history_has_data %} is-hidden{% endif %}">Нет данных для сравнения выбранных лет за выбранный месяц.</div>
    <p id="mlCompareChartSummary" class="panel-meta"></p>
    <div id="mlCompareError" class="chart-empty is-hidden"></div>
</section>
