<section class="panel filters-panel">
    <div class="panel-head">
        <h2>Параметры сравнения</h2>
        <span class="panel-meta">Две линии по дням месяца: факт, при отсутствии факта — ML.</span>
    </div>
    <form class="filters-grid ml-controls-grid" id="mlModelForm" method="get" action="/ml-model">
        <label class="filter-field">
            <span>Месяц</span>
            <select id="mlMonthFilter" name="month"></select>
        </label>
        <label class="filter-field">
            <span>Год A</span>
            <select id="mlYearAFilter" name="year_a"></select>
        </label>
        <label class="filter-field">
            <span>Год B</span>
            <select id="mlYearBFilter" name="year_b"></select>
        </label>
        <div class="filter-field filter-actions ml-actions">
            <span>Действие</span>
            <button id="mlRefreshButton" class="primary-action" type="submit">Показать</button>
        </div>
    </form>
    <div id="mlCompareError" class="chart-empty is-hidden"></div>
</section>
