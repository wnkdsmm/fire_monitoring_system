<section id="mlForecastSection" class="ml-layout">
    <div class="ml-primary">
        <article class="panel chart-panel{% if not data.compare_series or not data.compare_series.history_has_data %} is-chart-empty{% endif %}">
            <div class="panel-head">
                <h2 id="mlCompareTitle">Динамика пожаров по дням выбранного месяца</h2>
                <span class="panel-meta">Четыре линии по дням месяца: Год 1, Год 2, OLS-эталон и Poisson-прогноз для года прогноза.</span>
            </div>
            <div id="mlCompareChart" class="plotly-chart ml-plot{% if not data.compare_series or not data.compare_series.history_has_data %} is-empty{% endif %}"></div>
            <div id="mlCompareChartFallback" class="chart-empty{% if data.compare_series and data.compare_series.history_has_data %} is-hidden{% endif %}">Нет данных для сравнения выбранных лет за выбранный месяц.</div>
            <p id="mlCompareChartSummary" class="panel-meta"></p>
        </article>
    </div>
</section>
